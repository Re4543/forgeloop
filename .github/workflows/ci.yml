name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    name: Unit Tests (mock LLM, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v --tb=short

  credential-scan:
    name: Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for API keys in source
        run: |
          if grep -rE 'sk-[A-Za-z0-9]{20,}' --include='*.py' --include='*.yaml' --include='*.yml' --include='*.md' . ; then
            echo "ERROR: API key pattern found in source files"
            exit 1
          fi
          echo "No credentials found in source files"

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t forgeloop:latest .
      - name: Verify entrypoint
        run: docker run --rm forgeloop:latest --help
